services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?}
      DEBUG: "False"
      DB_ENGINE: postgres
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      CSRF_EXTRA_ORIGINS: ${CSRF_EXTRA_ORIGINS:-}
    volumes:
      - media:/app/backend/media
      - staticfiles:/app/backend/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:8000/api/categories/', headers={'X-Forwarded-Proto':'https'}), timeout=3).close()"
      interval: 10s
      timeout: 4s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/coolify-api.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - media:/srv/media:ro
      - staticfiles:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  media:
  staticfiles:
