services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cinar_catalog}
      POSTGRES_USER: ${DB_USER:-cinar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DEBUG: "False"
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-cinar_catalog}
      DB_USER: ${DB_USER:-cinar}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_HOST: db
      CSRF_EXTRA_ORIGINS: ${CSRF_EXTRA_ORIGINS:-}
    volumes:
      - media:/app/backend/media
      - staticfiles:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:8000/api/categories/', headers={'X-Forwarded-Proto':'https'}), timeout=3).close()"
      interval: 10s
      timeout: 4s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/coolify-api.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - media:/srv/media:ro
      - staticfiles:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  media:
  staticfiles:
