services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cinar_catalog}
      POSTGRES_USER: ${DB_USER:-cinar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-www.cinarkombiyedekparca.com}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY gerekli}
      DEBUG: "False"
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-cinar_catalog}
      DB_USER: ${DB_USER:-cinar}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      DB_HOST: db
    volumes:
      - media:/app/backend/media
      - staticfiles:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import Request, urlopen; urlopen(Request('http://127.0.0.1:8000/api/categories/', headers={'X-Forwarded-Proto':'https'}), timeout=3).close()"
      interval: 10s
      timeout: 4s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        SITE_ORIGIN: https://${SITE_DOMAIN:-www.cinarkombiyedekparca.com}
    restart: unless-stopped
    environment:
      SITE_ORIGIN: https://${SITE_DOMAIN:-www.cinarkombiyedekparca.com}
      DJANGO_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/', {signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-www.cinarkombiyedekparca.com}
      REDIRECT_DOMAIN: ${REDIRECT_DOMAIN:-cinarkombiyedekparca.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - staticfiles:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  db_data:
  media:
  staticfiles:
  caddy_data:
  caddy_config:
